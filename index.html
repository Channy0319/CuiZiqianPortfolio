<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8a5737" />
    <script>
      document.documentElement.classList.add("is-initial-loading");
      const initialFallbackMs = !location.hash || location.hash === "#" ? 3500 : 1700;
      window.__initialRevealFallback = window.setTimeout(() => {
        window.__initialRevealAt = performance.now();
        document.documentElement.classList.remove("is-initial-loading");
        document.documentElement.classList.add("is-initial-ready");
      }, initialFallbackMs);
    </script>
    <meta
      name="description"
      content="Cui Ziqian — brand marketing, global communication and content strategy."
    />
    <title>Cui Ziqian — Craft Table</title>
    <link rel="preload" href="/assets/wood-desk-background.jpg" as="image" />
    <script>
      if (!location.hash || location.hash === "#") {
        for (const href of [
          "/assets/craft-table-object-sprites-polished.png",
          "/assets/notebook-only-v3.png",
        ]) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = href;
          document.head.append(preload);
        }
      }
    </script>
    <link rel="stylesheet" href="/src/craft-table-v3.css" />
    <link rel="stylesheet" href="/src/project-scene-v3.css" />
    <link rel="stylesheet" href="/src/resume-scene-v3.css" />
    <link rel="stylesheet" href="/src/work-in-progress-v3.css" />
    <link rel="stylesheet" href="/src/operation-scene-v3.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
